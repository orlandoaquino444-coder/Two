<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Brisa - Red Social</title>

<style>
:root{
    --turquesa:#19c7b5;
    --turquesa-dark:#0b9f92;
    --turquesa-light:#d9faf6;
    --marron:#6b4636;
    --marron-dark:#493025;
    --crema:#fffaf4;
    --blanco:#ffffff;
    --texto:#2c2724;
    --gris:#77716c;
    --gris-claro:#eee8e2;
    --rojo:#e85d75;
    --sombra:0 5px 25px rgba(72,48,38,.10);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f1ed;
    color:var(--texto);
}

button,input,textarea{
    font-family:inherit;
}

button{
    cursor:pointer;
    border:0;
}

.app{
    min-height:100vh;
    padding-bottom:80px;
}

/* =========================
   HEADER
========================= */

.topbar{
    position:sticky;
    top:0;
    z-index:100;
    height:65px;
    background:rgba(255,250,244,.96);
    backdrop-filter:blur(15px);
    border-bottom:1px solid var(--gris-claro);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
}

.logo{
    font-size:25px;
    font-weight:900;
    letter-spacing:-1px;
    color:var(--marron);
}

.logo span{
    color:var(--turquesa-dark);
}

.header-actions{
    display:flex;
    gap:8px;
}

.icon-btn{
    width:42px;
    height:42px;
    border-radius:50%;
    background:transparent;
    font-size:22px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.icon-btn:hover{
    background:var(--turquesa-light);
}

/* =========================
   MAIN
========================= */

.container{
    width:100%;
    max-width:680px;
    margin:auto;
}

/* =========================
   STORIES
========================= */

.stories{
    display:flex;
    gap:14px;
    overflow-x:auto;
    padding:17px 15px;
    background:var(--blanco);
    scrollbar-width:none;
}

.stories::-webkit-scrollbar{
    display:none;
}

.story{
    min-width:68px;
    text-align:center;
    font-size:11px;
    color:var(--gris);
}

.story-avatar{
    width:60px;
    height:60px;
    border-radius:50%;
    padding:3px;
    background:linear-gradient(135deg,var(--turquesa),var(--marron));
    margin:auto auto 5px;
}

.story-avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:50%;
    border:3px solid white;
}

.add-story{
    position:relative;
}

.plus-story{
    position:absolute;
    right:0;
    bottom:15px;
    width:22px;
    height:22px;
    border-radius:50%;
    background:var(--turquesa);
    color:white;
    border:2px solid white;
    font-weight:bold;
}

/* =========================
   POST
========================= */

.post{
    background:var(--blanco);
    margin:12px 0;
    box-shadow:0 2px 12px rgba(0,0,0,.04);
}

.post-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 14px;
}

.user-info{
    display:flex;
    align-items:center;
    gap:10px;
}

.avatar{
    width:43px;
    height:43px;
    border-radius:50%;
    object-fit:cover;
    background:var(--turquesa-light);
}

.username{
    font-weight:800;
    font-size:14px;
}

.post-time{
    color:var(--gris);
    font-size:11px;
    margin-top:2px;
}

.post-menu{
    background:none;
    font-size:22px;
    color:var(--gris);
    padding:8px;
}

.post-media{
    width:100%;
    background:#151515;
    position:relative;
}

.post-media img,
.post-media video{
    width:100%;
    max-height:700px;
    object-fit:cover;
    display:block;
}

.post-actions{
    display:flex;
    justify-content:space-between;
    padding:9px 13px 3px;
}

.left-actions{
    display:flex;
    gap:3px;
}

.action{
    width:43px;
    height:43px;
    border-radius:50%;
    background:none;
    font-size:23px;
    transition:.15s;
}

.action:active{
    transform:scale(.88);
}

.action.liked{
    color:var(--rojo);
}

.action.reacted{
    color:var(--turquesa-dark);
}

.post-body{
    padding:0 15px 14px;
}

.likes{
    font-weight:bold;
    font-size:14px;
    margin:3px 0 7px;
}

.caption{
    font-size:14px;
    line-height:1.4;
}

.caption strong{
    margin-right:5px;
}

.comments-link{
    color:var(--gris);
    font-size:13px;
    margin-top:8px;
    cursor:pointer;
}

.view-counter{
    color:var(--gris);
    font-size:11px;
    margin-top:8px;
}

/* =========================
   EMPTY
========================= */

.empty{
    text-align:center;
    padding:70px 25px;
    color:var(--gris);
}

.empty-icon{
    font-size:55px;
    margin-bottom:15px;
}

/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    z-index:200;
    height:68px;
    background:rgba(255,250,244,.97);
    backdrop-filter:blur(15px);
    border-top:1px solid var(--gris-claro);
    display:flex;
    justify-content:space-around;
    align-items:center;
}

.nav-item{
    flex:1;
    max-width:110px;
    height:100%;
    background:none;
    color:var(--gris);
    font-size:11px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:4px;
}

.nav-item span{
    font-size:23px;
}

.nav-item.active{
    color:var(--turquesa-dark);
    font-weight:bold;
}

.create-nav span{
    background:var(--turquesa);
    color:white;
    width:45px;
    height:34px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
}

/* =========================
   PROFILE
========================= */

.profile{
    display:none;
    background:var(--blanco);
    min-height:calc(100vh - 65px);
}

.profile-top{
    padding:25px 18px;
}

.profile-main{
    display:flex;
    gap:22px;
    align-items:center;
}

.profile-photo-wrap{
    position:relative;
}

.profile-photo{
    width:90px;
    height:90px;
    border-radius:50%;
    object-fit:cover;
    border:4px solid var(--turquesa-light);
}

.profile-photo-edit{
    position:absolute;
    bottom:0;
    right:0;
    width:31px;
    height:31px;
    border-radius:50%;
    background:var(--turquesa);
    color:white;
    border:3px solid white;
}

.profile-name{
    font-size:21px;
    font-weight:900;
}

.profile-handle{
    color:var(--gris);
    margin-top:4px;
}

.stats{
    display:flex;
    gap:25px;
    margin-top:22px;
}

.stat{
    text-align:center;
}

.stat strong{
    display:block;
    font-size:18px;
}

.stat span{
    color:var(--gris);
    font-size:12px;
}

.profile-buttons{
    display:flex;
    gap:8px;
    margin-top:20px;
}

.profile-btn{
    flex:1;
    padding:11px;
    border-radius:10px;
    background:var(--gris-claro);
    color:var(--texto);
    font-weight:bold;
}

.profile-btn.primary{
    background:var(--turquesa);
    color:white;
}

.profile-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:2px;
}

.grid-item{
    aspect-ratio:1;
    background:#ddd;
    position:relative;
    overflow:hidden;
}

.grid-item img,
.grid-item video{
    width:100%;
    height:100%;
    object-fit:cover;
}

.grid-video{
    position:absolute;
    top:8px;
    right:8px;
    color:white;
    font-size:18px;
}

/* =========================
   MODALS
========================= */

.overlay{
    position:fixed;
    inset:0;
    z-index:500;
    background:rgba(35,25,20,.55);
    display:none;
    align-items:flex-end;
    justify-content:center;
}

.overlay.show{
    display:flex;
}

.modal{
    width:100%;
    max-width:680px;
    max-height:92vh;
    overflow:auto;
    background:var(--crema);
    border-radius:25px 25px 0 0;
    padding:22px;
    animation:up .2s ease;
}

@keyframes up{
    from{transform:translateY(100%);}
    to{transform:translateY(0);}
}

.modal h2{
    margin-bottom:18px;
    color:var(--marron-dark);
}

.close{
    float:right;
    background:none;
    font-size:25px;
    color:var(--gris);
}

.input{
    width:100%;
    padding:14px;
    border:1px solid #ddd3ca;
    border-radius:12px;
    background:white;
    outline:none;
    font-size:15px;
    margin-bottom:12px;
}

.input:focus{
    border-color:var(--turquesa);
}

textarea.input{
    resize:none;
    min-height:90px;
}

.primary-btn{
    width:100%;
    padding:14px;
    background:var(--turquesa);
    color:white;
    border-radius:12px;
    font-weight:bold;
    font-size:15px;
}

.secondary-btn{
    width:100%;
    padding:14px;
    background:var(--gris-claro);
    color:var(--texto);
    border-radius:12px;
    font-weight:bold;
    margin-top:8px;
}

.file-label{
    width:100%;
    min-height:180px;
    border:2px dashed var(--turquesa);
    background:var(--turquesa-light);
    border-radius:15px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    cursor:pointer;
    padding:20px;
    margin-bottom:15px;
}

.file-label .big{
    font-size:45px;
    margin-bottom:8px;
}

.file-label strong{
    color:var(--marron);
}

#mediaInput,
#profileInput{
    display:none;
}

.preview{
    display:none;
    width:100%;
    max-height:350px;
    object-fit:contain;
    background:#111;
    border-radius:13px;
    margin-bottom:15px;
}

/* =========================
   PROFILE MENU
========================= */

.profile-menu{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.menu-option{
    padding:16px;
    border-radius:13px;
    background:white;
    text-align:left;
    font-weight:bold;
}

.menu-option:hover{
    background:var(--turquesa-light);
}

.menu-option.danger{
    color:#d94e64;
}

/* =========================
   COMMENTS
========================= */

.comment-list{
    max-height:330px;
    overflow:auto;
    margin-bottom:15px;
}

.comment{
    display:flex;
    gap:10px;
    margin-bottom:13px;
}

.comment-avatar{
    width:34px;
    height:34px;
    border-radius:50%;
    object-fit:cover;
}

.comment-content{
    background:white;
    padding:9px 12px;
    border-radius:12px;
    flex:1;
}

.comment-content strong{
    display:block;
    font-size:13px;
    margin-bottom:3px;
}

.comment-content p{
    font-size:13px;
}

/* =========================
   SEARCH
========================= */

.search-page{
    display:none;
    padding:18px;
}

.search-box{
    display:flex;
    gap:8px;
    margin-bottom:18px;
}

.search-box input{
    flex:1;
    margin:0;
}

.search-result{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px;
    background:white;
    border-radius:13px;
    margin-bottom:8px;
}

.search-result img{
    width:48px;
    height:48px;
    border-radius:50%;
    object-fit:cover;
}

/* =========================
   NOTIFICATIONS
========================= */

.notifications{
    display:none;
    padding:20px;
}

.notification{
    background:white;
    padding:15px;
    border-radius:13px;
    margin-bottom:8px;
}

/* =========================
   DARK MODE
========================= */

body.dark{
    --crema:#171311;
    --blanco:#211c19;
    --texto:#f7f0ea;
    --gris:#aaa19b;
    --gris-claro:#39312c;
    background:#111;
}

body.dark .topbar,
body.dark .bottom-nav{
    background:rgba(30,25,22,.97);
}

body.dark .input,
body.dark .menu-option,
body.dark .comment-content,
body.dark .search-result,
body.dark .notification{
    background:#2a2420;
    color:white;
}

body.dark .profile{
    background:#211c19;
}

body.dark .stories{
    background:#211c19;
}

/* =========================
   DESKTOP
========================= */

@media(min-width:800px){
    .bottom-nav{
        width:680px;
        left:50%;
        transform:translateX(-50%);
        border-left:1px solid var(--gris-claro);
        border-right:1px solid var(--gris-claro);
    }

    .post{
        border-radius:14px;
        overflow:hidden;
    }

    .stories{
        border-radius:0 0 14px 14px;
        margin-bottom:12px;
    }
}
</style>
</head>

<body>

<div class="app">

<!-- HEADER -->
<header class="topbar">
    <div class="logo">Brisa<span>+</span></div>

    <div class="header-actions">
        <button class="icon-btn" onclick="openSearch()">⌕</button>
        <button class="icon-btn" onclick="openNotifications()">♡</button>
        <button class="icon-btn" onclick="openProfileMenu()">☰</button>
    </div>
</header>


<main class="container">

<!-- HOME -->
<section id="homePage">

    <div class="stories">

        <div class="story add-story" onclick="openStoryUpload()">
            <div class="story-avatar">
                <img id="storyMyAvatar" src="">
            </div>
            <div class="plus-story">+</div>
            Tu historia
        </div>

        <div class="story">
            <div class="story-avatar">
                <img src="https://i.pravatar.cc/100?img=12">
            </div>
            Ana
        </div>

        <div class="story">
            <div class="story-avatar">
                <img src="https://i.pravatar.cc/100?img=32">
            </div>
            Mateo
        </div>

        <div class="story">
            <div class="story-avatar">
                <img src="https://i.pravatar.cc/100?img=47">
            </div>
            Sofía
        </div>

        <div class="story">
            <div class="story-avatar">
                <img src="https://i.pravatar.cc/100?img=5">
            </div>
            Lucas
        </div>

    </div>

    <div id="feed"></div>

</section>


<!-- SEARCH -->
<section id="searchPage" class="search-page">

    <div class="search-box">
        <input id="searchInput" class="input" placeholder="Buscar personas..." oninput="searchUsers()">
        <button class="primary-btn" style="width:55px" onclick="closePages()">×</button>
    </div>

    <div id="searchResults"></div>

</section>


<!-- NOTIFICATIONS -->
<section id="notificationsPage" class="notifications">

    <h2 style="margin-bottom:15px">Actividad</h2>

    <div id="notificationsList"></div>

</section>


<!-- PROFILE -->
<section id="profilePage" class="profile">

    <div class="profile-top">

        <div class="profile-main">

            <div class="profile-photo-wrap">
                <img id="profilePhoto" class="profile-photo" src="">
                <button class="profile-photo-edit" onclick="changeProfilePhoto()">✎</button>
            </div>

            <div>
                <div id="profileName" class="profile-name"></div>
                <div id="profileHandle" class="profile-handle"></div>
            </div>

        </div>

        <div class="stats">
            <div class="stat">
                <strong id="postCount">0</strong>
                <span>Publicaciones</span>
            </div>

            <div class="stat">
                <strong>0</strong>
                <span>Seguidores</span>
            </div>

            <div class="stat">
                <strong>0</strong>
                <span>Siguiendo</span>
            </div>
        </div>

        <div class="profile-buttons">
            <button class="profile-btn primary" onclick="openProfileMenu()">
                Editar perfil
            </button>

            <button class="profile-btn" onclick="openSettings()">
                ⚙️
            </button>
        </div>

    </div>

    <div id="profileGrid" class="profile-grid"></div>

</section>

</main>


<!-- BOTTOM NAVIGATION -->

<nav class="bottom-nav">

    <button class="nav-item active" onclick="showHome()">
        <span>⌂</span>
        Inicio
    </button>

    <button class="nav-item" onclick="openSearch()">
        <span>⌕</span>
        Buscar
    </button>

    <button class="nav-item create-nav" onclick="openCreatePost()">
        <span>+</span>
        Crear
    </button>

    <button class="nav-item" onclick="openNotifications()">
        <span>♡</span>
        Actividad
    </button>

    <button class="nav-item" onclick="showProfile()">
        <span>◉</span>
        Perfil
    </button>

</nav>

</div>


<!-- =========================
     CREATE POST MODAL
========================= -->

<div id="createOverlay" class="overlay">

    <div class="modal">

        <button class="close" onclick="closeModal('createOverlay')">×</button>

        <h2>Crear publicación</h2>

        <label class="file-label" for="mediaInput">

            <div class="big">📸</div>

            <strong>Seleccionar desde tu galería</strong>

            <span style="color:#777;margin-top:7px">
                Elige una foto o video de tu teléfono
            </span>

        </label>

        <input
            id="mediaInput"
            type="file"
            accept="image/*,video/*"
            onchange="previewMedia(event)"
        >

        <img id="imagePreview" class="preview">

        <video id="videoPreview" class="preview" controls></video>

        <textarea
            id="captionInput"
            class="input"
            placeholder="Escribe algo sobre tu publicación..."
        ></textarea>

        <button class="primary-btn" onclick="createPost()">
            Publicar
        </button>

    </div>

</div>


<!-- =========================
     PROFILE MENU
========================= -->

<div id="profileMenuOverlay" class="overlay">

    <div class="modal">

        <button class="close" onclick="closeModal('profileMenuOverlay')">×</button>

        <h2>Mi perfil</h2>

        <div class="profile-menu">

            <button class="menu-option" onclick="changeProfilePhoto()">
                📷 Cambiar foto de perfil
            </button>

            <button class="menu-option" onclick="changeUsername()">
                ✏️ Cambiar nombre de usuario
            </button>

            <button class="menu-option" onclick="openSettings()">
                ⚙️ Configuración
            </button>

            <button class="menu-option" onclick="toggleDarkMode()">
                🌙 Cambiar apariencia
            </button>

        </div>

    </div>

</div>


<!-- =========================
     CHANGE USERNAME
========================= -->

<div id="usernameOverlay" class="overlay">

    <div class="modal">

        <button class="close" onclick="closeModal('usernameOverlay')">×</button>

        <h2>Cambiar nombre de usuario</h2>

        <input
            id="usernameInput"
            class="input"
            placeholder="Nuevo nombre de usuario"
            maxlength="25"
        >

        <button class="primary-btn" onclick="saveUsername()">
            Guardar
        </button>

    </div>

</div>


<!-- =========================
     PROFILE PHOTO INPUT
========================= -->

<input
    id="profileInput"
    type="file"
    accept="image/*"
    onchange="saveProfilePhoto(event)"
>


<!-- =========================
     COMMENTS
========================= -->

<div id="commentsOverlay" class="overlay">

    <div class="modal">

        <button class="close" onclick="closeModal('commentsOverlay')">×</button>

        <h2>Comentarios</h2>

        <div id="commentList" class="comment-list"></div>

        <input
            id="commentInput"
            class="input"
            placeholder="Escribe un comentario..."
            maxlength="300"
        >

        <button class="primary-btn" onclick="addComment()">
            Comentar
        </button>

    </div>

</div>


<!-- =========================
     SETTINGS
========================= -->

<div id="settingsOverlay" class="overlay">

    <div class="modal">

        <button class="close" onclick="closeModal('settingsOverlay')">×</button>

        <h2>Configuración</h2>

        <button class="menu-option" onclick="toggleDarkMode();closeModal('settingsOverlay')">
            🌙 Apariencia
        </button>

        <button class="menu-option" onclick="clearLocalData()">
            🗑️ Borrar datos locales
        </button>

        <p style="color:#777;font-size:12px;margin-top:15px;line-height:1.5">
            En esta versión de demostración, la información se guarda
            localmente en este navegador.
        </p>

    </div>

</div>


<script>

/* =========================================================
   DATOS DE LA APLICACIÓN
========================================================= */

const DEFAULT_AVATAR =
    "https://i.pravatar.cc/200?img=68";

let currentCommentPostId = null;

let currentUser = JSON.parse(
    localStorage.getItem("brisaUser")
) || {
    id: "user-" + Date.now(),
    username: "usuario_nuevo",
    photo: DEFAULT_AVATAR
};

let posts = JSON.parse(
    localStorage.getItem("brisaPosts")
) || [];


/* =========================================================
   GUARDAR DATOS
========================================================= */

function saveData(){

    localStorage.setItem(
        "brisaUser",
        JSON.stringify(currentUser)
    );

    localStorage.setItem(
        "brisaPosts",
        JSON.stringify(posts)
    );

}


/* =========================================================
   INICIALIZACIÓN
========================================================= */

document.addEventListener("DOMContentLoaded",function(){

    updateUserInterface();

    renderFeed();

    renderProfile();

    loadDarkMode();

});


/* =========================================================
   ACTUALIZAR PERFIL
========================================================= */

function updateUserInterface(){

    document.getElementById("profilePhoto").src =
        currentUser.photo;

    document.getElementById("storyMyAvatar").src =
        currentUser.photo;

    document.getElementById("profileName").textContent =
        currentUser.username;

    document.getElementById("profileHandle").textContent =
        "@" + currentUser.username;

}


/* =========================================================
   CREAR PUBLICACIÓN
========================================================= */

function openCreatePost(){

    document.getElementById("createOverlay")

function previewMedia(event){

    const file = event.target.files[0];

    if(!file) return;

    const image = document.getElementById("imagePreview");
    const video = document.getElementById("videoPreview");

    image.style.display = "none";
    video.style.display = "none";

    const url = URL.createObjectURL(file);

    if(file.type.startsWith("image/")){

        image.src = url;
        image.style.display = "block";

    }

    else if(file.type.startsWith("video/")){

        video.src = url;
        video.style.display = "block";

    }

}


/* =========================================================
   CONVERTIR IMAGEN A FORMATO MÁS PEQUEÑO
   PARA QUE OCUPE MENOS ESPACIO
========================================================= */

function compressImage(file){

    return new Promise((resolve,reject)=>{

        const reader = new FileReader();

        reader.onload = function(event){

            const img = new Image();

            img.onload = function(){

                const maxWidth = 1200;

                let width = img.width;
                let height = img.height;

                if(width > maxWidth){

                    height =
                        height * maxWidth / width;

                    width = maxWidth;

                }

                const canvas =
                    document.createElement("canvas");

                canvas.width = width;
                canvas.height = height;

                const ctx =
                    canvas.getContext("2d");

                ctx.drawImage(
                    img,
                    0,
                    0,
                    width,
                    height
                );

                resolve(
                    canvas.toDataURL(
                        "image/jpeg",
                        .82
                    )
                );

            };

            img.onerror = reject;

            img.src = event.target.result;

        };

        reader.onerror = reject;

        reader.readAsDataURL(file);

    });

}


/* =========================================================
   CREAR POST
========================================================= */

async function createPost(){

    const input =
        document.getElementById("mediaInput");

    const file =
        input.files[0];

    const caption =
        document.getElementById("captionInput")
        .value
        .trim();

    if(!file){

        alert("Primero selecciona una foto o video.");

        return;

    }

    try{

        let mediaData;

        if(file.type.startsWith("image/")){

            mediaData =
                await compressImage(file);

        }else{

            const reader =
                new FileReader();

            mediaData =
                await new Promise((resolve,reject)=>{

                    reader.onload =
                        () => resolve(reader.result);

                    reader.onerror = reject;

                    reader.readAsDataURL(file);

                });

        }


        const post = {

            id:
                "post-" +
                Date.now() +
                "-" +
                Math.random()
                .toString(36)
                .substring(2),

            userId:
                currentUser.id,

            username:
                currentUser.username,

            userPhoto:
                currentUser.photo,

            media:
                mediaData,

            mediaType:
                file.type.startsWith("video/")
                ? "video"
                : "image",

            caption:
                caption,

            likes:0,

            reactions:0,

            liked:false,

            reacted:false,

            comments:[],

            views:0,

            viewers:[],

            createdAt:
                Date.now()

        };


        posts.unshift(post);

        saveData();

        document.getElementById("mediaInput").value = "";

        document.getElementById("captionInput").value = "";

        document.getElementById("imagePreview").style.display =
            "none";

        document.getElementById("videoPreview").style.display =
            "none";

        closeModal("createOverlay");

        renderFeed();

        renderProfile();

    }

    catch(error){

        console.error(error);

        alert(
            "No se pudo guardar el archivo. " +
            "Si el video es muy grande, intenta con uno más pequeño."
        );

    }

}


/* =========================================================
   MOSTRAR FEED
========================================================= */

function renderFeed(){

    const feed =
        document.getElementById("feed");

    if(posts.length === 0){

        feed.innerHTML = `
            <div class="empty">
                <div class="empty-icon">🌊</div>
                <h2>Aún no hay publicaciones</h2>
                <p style="margin-top:8px">
                    Sé la primera persona en publicar algo.
                </p>
            </div>
        `;

        return;

    }


    feed.innerHTML =
        posts.map(post => createPostHTML(post)).join("");


    startViewTimers();

}


/* =========================================================
   HTML DE CADA POST
========================================================= */

function createPostHTML(post){

    const likedClass =
        post.liked ? "liked" : "";

    const reactedClass =
        post.reacted ? "reacted" : "";

    const isOwner =
        post.userId === currentUser.id;


    const media =
        post.mediaType === "video"

        ? `
            <video
                src="${post.media}"
                controls
                playsinline
                preload="metadata"
            ></video>
        `

        : `
            <img
                src="${post.media}"
                alt="Publicación"
            >
        `;


    const commentsCount =
        post.comments.length;


    const deleteButton =
        isOwner

        ? `
            <button
                class="menu-option danger"
                onclick="deletePost('${post.id}')"
            >
                🗑️ Eliminar publicación
            </button>
        `

        : "";


    return `

        <article
            class="post"
            data-post-id="${post.id}"
        >

            <div class="post-header">

                <div class="user-info">

                    <img
                        class="avatar"
                        src="${post.userPhoto}"
                    >

                    <div>

                        <div class="username">
                            ${escapeHTML(post.username)}
                        </div>

                        <div class="post-time">
                            ${formatDate(post.createdAt)}
                        </div>

                    </div>

                </div>

                <button
                    class="post-menu"
                    onclick="postOptions('${post.id}')"
                >
                    •••
                </button>

            </div>


            <div
                class="post-media"
                data-view-post="${post.id}"
            >

                ${media}

            </div>


            <div class="post-actions">

                <div class="left-actions">

                    <button
                        class="action ${likedClass}"
                        onclick="toggleLike('${post.id}')"
                    >
                        ${post.liked ? "♥" : "♡"}
                    </button>

                    <button
                        class="action ${reactedClass}"
                        onclick="toggleReaction('${post.id}')"
                    >
                        👍
                    </button>

                    <button
                        class="action"
                        onclick="openComments('${post.id}')"
                    >
                        ♧
                    </button>

                </div>

                <button
                    class="action"
                    onclick="sharePost('${post.id}')"
                >
                    ↗
                </button>

            </div>


            <div class="post-body">

                <div class="likes">
                    ${post.likes} me gusta ·
                    ${post.reactions} reacciones
                </div>

                ${
                    post.caption

                    ? `
                        <div class="caption">
                            <strong>
                                ${escapeHTML(post.username)}
                            </strong>
                            ${escapeHTML(post.caption)}
                        </div>
                    `

                    : ""
                }


                ${
                    commentsCount > 0

                    ? `
                        <div
                            class="comments-link"
                            onclick="openComments('${post.id}')"
                        >
                            Ver ${commentsCount}
                            comentario${commentsCount === 1 ? "" : "s"}
                        </div>
                    `

                    : `
                        <div
                            class="comments-link"
                            onclick="openComments('${post.id}')"
                        >
                            Añadir comentario...
                        </div>
                    `
                }


                <div class="view-counter">
                    👁️ ${post.views} vistas
                </div>

            </div>

        </article>
    `;

}


/* =========================================================
   ME GUSTA
========================================================= */

function toggleLike(id){

    const post =
        posts.find(p => p.id === id);

    if(!post) return;

    post.liked = !post.liked;

    post.likes +=
        post.liked ? 1 : -1;

    if(post.likes < 0)
        post.likes = 0;

    saveData();

    renderFeed();

}


/* =========================================================
   REACCIÓN 👍
========================================================= */

function toggleReaction(id){

    const post =
        posts.find(p => p.id === id);

    if(!post) return;

    post.reacted =
        !post.reacted;

    post.reactions +=
        post.reacted ? 1 : -1;

    if(post.reactions < 0)
        post.reactions = 0;

    saveData();

    renderFeed();

}


/* =========================================================
   COMENTARIOS
========================================================= */

function openComments(id){

    currentCommentPostId = id;

    const post =
        posts.find(p => p.id === id);

    if(!post) return;

    const list =
        document.getElementById("commentList");

    if(post.comments.length === 0){

        list.innerHTML = `
            <div class="empty" style="padding:30px">
                Todavía no hay comentarios.
            </div>
        `;

    }else{

        list.innerHTML =
            post.comments.map(comment => `

                <div class="comment">

                    <img
                        class="comment-avatar"
                        src="${comment.photo}"
                    >

                    <div class="comment-content">

                        <strong>
                            ${escapeHTML(comment.username)}
                        </strong>

                        <p>
                            ${escapeHTML(comment.text)}
                        </p>

                    </div>

                </div>

            `).join("");

    }

    document.getElementById("commentsOverlay")
        .classList.add("show");

}


function addComment(){

    const input =
        document.getElementById("commentInput");

    const text =
        input.value.trim();

    if(!text) return;

    const post =
        posts.find(
            p => p.id === currentCommentPostId
        );

    if(!post) return;

    post.comments.push({

        username:
            currentUser.username,

        photo:
            currentUser.photo,

        text:
            text,

        createdAt:
            Date.now()

    });

    input.value = "";

    saveData();

    openComments(currentCommentPostId);

    renderFeed();

}


/* =========================================================
   ELIMINAR POST
========================================================= */

function deletePost(id){

    const post =
        posts.find(p => p.id === id);

    if(!post) return;


    if(post.userId !== currentUser.id){

        alert(
            "Solo la persona que creó la publicación puede eliminarla."
        );

        return;

    }


    const confirmDelete =
        confirm(
            "¿Quieres eliminar esta publicación?"
        );

    if(!confirmDelete) return;


    posts =
        posts.filter(
            p => p.id !== id
        );

    saveData();

    renderFeed();

    renderProfile();

}


/* =========================================================
   MENÚ DE POST
========================================================= */

function postOptions(id){

    const post =
        posts.find(p => p.id === id);

    if(!post) return;

    if(post.userId === currentUser.id){

        if(confirm("¿Eliminar esta publicación?")){

            deletePost(id);

        }

    }else{

        alert(
            "Opciones: puedes comentar, reaccionar o compartir esta publicación."
        );

    }

}


/* =========================================================
   VISTAS DE 5 SEGUNDOS
========================================================= */

function startViewTimers(){

    const elements =
        document.querySelectorAll(
            "[data-view-post]"
        );


    elements.forEach(element => {

        const id =
            element.dataset.viewPost;


        let timerStarted = false;


        const observer =
            new IntersectionObserver(
                entries => {

                    entries.forEach(entry => {

                        if(
                            entry.isIntersecting &&
                            !timerStarted
                        ){

                            timerStarted = true;

                            setTimeout(
                                () => registerView(id),
                                5000
                            );

                        }

                    });

                },
                {
                    threshold:.6
                }
            );


        observer.observe(element);

    });

}


/* =========================================================
   REGISTRAR VISTA
========================================================= */

function registerView(id){

    const post =
        posts.find(p => p.id === id);

    if(!post) return;


    /*
       La misma persona no genera otra vista
       para la misma publicación.
    */

    if(
        post.viewers &&
        post.viewers.includes(currentUser.id)
    ){

        return;

    }


    if(!post.viewers)
        post.viewers = [];


    post.viewers.push(
        currentUser.id
    );

    post.views++;

    saveData();

    renderFeed();

}


/* =========================================================
   CAMBIAR FOTO DE PERFIL
========================================================= */

function changeProfilePhoto(){

    closeModal("profileMenuOverlay");

    document.getElementById("profileInput").click();

}


async function saveProfilePhoto(event){

    const file =
        event.target.files[0];

    if(!file) return;


    if(!file.type.startsWith("image/")){

        alert("Selecciona una imagen.");

        return;

    }


    try{

        const image =
            await compressImage(file);

        currentUser.photo =
            image;


        /*
           También actualizamos la foto
           que aparece en publicaciones antiguas.
        */

        posts.forEach(post => {

            if(post.userId === currentUser.id){

                post.userPhoto =
                    image;

            }

        });


        saveData();

        updateUserInterface();

        renderFeed();

        renderProfile();

    }

    catch(error){

        alert(
            "No se pudo cambiar la foto."
        );

    }

}


/* =========================================================
   CAMBIAR NOMBRE
========================================================= */

function changeUsername(){

    closeModal("profileMenuOverlay");

    document.getElementById("usernameInput").value =
        currentUser.username;

    document.getElementById("usernameOverlay")
        .classList.add("show");

}


function saveUsername(){

    let name =
        document.getElementById("usernameInput")
        .value
        .trim()
        .replace(/\s+/g,"_");


    if(name.length < 3){

        alert(
            "El nombre debe tener al menos 3 caracteres."
        );

        return;

    }


    currentUser.username =
        name.substring(0,25);


    posts.forEach(post => {

        if(post.userId === currentUser.id){

            post.username =
                currentUser.username;

        }

    });


    saveData();

    updateUserInterface();

    renderFeed();

    renderProfile();

    closeModal("usernameOverlay");

}


/* =========================================================
   PERFIL
========================================================= */

function renderProfile(){

    const myPosts =
        posts.filter(
            post =>
                post.userId === currentUser.id
        );


    document.getElementById("postCount")
        .textContent =
        myPosts.length;


    const grid =
        document.getElementById("profileGrid");


    if(myPosts.length === 0){

        grid.innerHTML = "";

        return;

    }


    grid.innerHTML =
        myPosts.map(post => `

            <div
                class="grid-item"
                onclick="scrollToPost('${post.id}')"
            >

                ${
                    post.mediaType === "video"

                    ? `
                        <video
                            src="${post.media}"
                        ></video>

                        <div class="grid-video">
                            ▶
                        </div>
                    `

                    : `
                        <img
                            src="${post.media}"
                        >
                    `
                }

            </div>

        `).join("");

}

    buttons.forEach(
        b => b.classList.remove("active")

    if(buttons[index])
        buttons[index].classList.add("active");

/* =========================================================
   COMPARTIR
========================================================= */

async function sharePost(id){

    const post =
        posts.find(p => p.id === id);

    if(!post) return;


    if(
        navigator.share
    ){

        try{

            await navigator.share({

                title:"Brisa+",

                text:
                    post.caption ||
                    "Mira esta publicación"

            });

        }

        catch(error){}

    }

    else{

        alert(
            "La función compartir está disponible en dispositivos compatibles."
        );

    }

}

/* =========================================================
   ESCAPAR HTML
========================================================= */

function escapeHTML(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   FECHA
========================================================= */

function formatDate(timestamp){

    const diff =
        Date.now() - timestamp;


    const seconds =
        Math.floor(diff / 1000);

    if(seconds < 60)
        return "Ahora";


    const minutes =
        Math.floor(seconds / 60);

    if(minutes < 60)
        return `Hace ${minutes} min`;


    const hours =
        Math.floor(minutes / 60);

    if(hours < 24)
        return `Hace ${hours} h`;


    const days =
        Math.floor(hours / 24);

    return `Hace ${days} día${days === 1 ? "" : "s"}`;

}
